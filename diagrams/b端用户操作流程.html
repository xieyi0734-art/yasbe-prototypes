<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B端用户操作流程图 - YASBee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0B0E14; font-family: 'Inter', -apple-system, sans-serif; display: flex; justify-content: center; padding: 40px 20px; }
  .container { max-width: 800px; width: 100%; }
  .title { color: #E8ECF0; font-size: 24px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
  .title .badge { background: rgba(229,147,3,.15); color: #E59303; font-size: 11px; padding: 3px 10px; border-radius: 6px; font-weight: 600; }
  .subtitle { color: #7B8CA8; font-size: 13px; margin-bottom: 6px; }
  .meta { color: #4B5563; font-size: 11px; margin-bottom: 24px; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="container">
  <div class="title">
    用户操作流程图
    <span class="badge">B端 · YASBee PayFi</span>
  </div>
  <div class="subtitle">从注册到卡片使用的完整用户操作路径</div>
  <div class="meta">注册 → KYB → 上游KYB → 开卡 → 激活 → 使用</div>
  <svg viewBox="0 0 760 1480" xmlns="http://www.w3.org/2000/svg">

    <defs>
      <!-- 标准箭头（灰色） -->
      <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,.18)"/>
      </marker>
      <!-- 绿色箭头（通过） -->
      <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#22C55E"/>
      </marker>
      <!-- 红色箭头（驳回） -->
      <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
      </marker>
      <!-- 金色箭头 -->
      <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#E59303"/>
      </marker>
      <!-- 浅蓝箭头 -->
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6"/>
      </marker>

      <!-- 阴影滤镜 -->
      <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,.3)"/>
      </filter>
      <filter id="shadow-diamond" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,.25)"/>
      </filter>

      <!-- 渐变 -->
      <linearGradient id="grad-start" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1a2536"/>
        <stop offset="100%" stop-color="#2d4a6e"/>
      </linearGradient>
      <linearGradient id="grad-end" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#131820"/>
        <stop offset="100%" stop-color="#1a2536"/>
      </linearGradient>
    </defs>

    <!-- ===== 阶段编号标签（左侧） ===== -->
    <!-- 阶段1 -->
    <g transform="translate(30, 52)">
      <rect x="0" y="0" width="24" height="24" rx="12" fill="rgba(59,130,246,.2)"/>
      <text x="12" y="16" fill="#3B82F6" font-size="12" font-weight="700" text-anchor="middle">1</text>
    </g>
    <!-- 阶段2 -->
    <g transform="translate(30, 262)">
      <rect x="0" y="0" width="24" height="24" rx="12" fill="rgba(239,68,68,.2)"/>
      <text x="12" y="16" fill="#EF4444" font-size="12" font-weight="700" text-anchor="middle">2</text>
    </g>
    <!-- 阶段3 -->
    <g transform="translate(30, 482)">
      <rect x="0" y="0" width="24" height="24" rx="12" fill="rgba(229,147,3,.2)"/>
      <text x="12" y="16" fill="#E59303" font-size="12" font-weight="700" text-anchor="middle">3</text>
    </g>
    <!-- 阶段4 -->
    <g transform="translate(30, 812)">
      <rect x="0" y="0" width="24" height="24" rx="12" fill="rgba(22,163,74,.2)"/>
      <text x="12" y="16" fill="#22C55E" font-size="12" font-weight="700" text-anchor="middle">4</text>
    </g>
    <!-- 阶段5 -->
    <g transform="translate(30, 1012)">
      <rect x="0" y="0" width="24" height="24" rx="12" fill="rgba(139,92,246,.2)"/>
      <text x="12" y="16" fill="#8B5CF6" font-size="12" font-weight="700" text-anchor="middle">5</text>
    </g>
    <!-- 阶段6 -->
    <g transform="translate(30, 1222)">
      <rect x="0" y="0" width="24" height="24" rx="12" fill="rgba(16,185,129,.2)"/>
      <text x="12" y="16" fill="#10B981" font-size="12" font-weight="700" text-anchor="middle">6</text>
    </g>

    <!-- ===== 阶段标签竖线 ===== -->
    <line x1="42" y1="76" x2="42" y2="280" stroke="rgba(59,130,246,.15)" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="42" y1="286" x2="42" y2="500" stroke="rgba(239,68,68,.15)" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="42" y1="506" x2="42" y2="830" stroke="rgba(229,147,3,.15)" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="42" y1="836" x2="42" y2="1030" stroke="rgba(22,163,74,.15)" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="42" y1="1036" x2="42" y2="1240" stroke="rgba(139,92,246,.15)" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="42" y1="1246" x2="42" y2="1380" stroke="rgba(16,185,129,.15)" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- ===== 阶段标签文字（左侧） ===== -->
    <text x="42" y="90" fill="#3B82F6" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">注册</text>
    <text x="42" y="300" fill="#EF4444" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">平台</text>
    <text x="42" y="312" fill="#EF4444" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">KYB</text>
    <text x="42" y="520" fill="#E59303" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">上游</text>
    <text x="42" y="532" fill="#E59303" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">KYB</text>
    <text x="42" y="850" fill="#22C55E" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">开卡</text>
    <text x="42" y="1050" fill="#8B5CF6" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">激活</text>
    <text x="42" y="1260" fill="#10B981" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">使用</text>

    <!-- ============================================ -->
    <!-- 1. 注册 -->
    <!-- ============================================ -->

    <!-- 步骤节点：注册YASBee账户 -->
    <rect x="175" y="40" width="410" height="56" rx="28" fill="url(#grad-start)" stroke="rgba(255,255,255,.15)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="380" y="62" fill="#E8ECF0" font-size="14" font-weight="600" text-anchor="middle">📝 注册 YASBee 账户</text>
    <text x="380" y="80" fill="#7B8CA8" font-size="11" text-anchor="middle">填写邮箱、密码、企业基本信息</text>

    <!-- 箭头 → 平台KYB -->
    <path d="M 380,96 L 380,135" stroke="rgba(255,255,255,.18)" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>

    <!-- ============================================ -->
    <!-- 2. 平台KYB -->
    <!-- ============================================ -->

    <!-- 步骤节点：提交企业KYB -->
    <rect x="175" y="140" width="410" height="56" rx="8" fill="#131820" stroke="rgba(255,255,255,.15)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="380" y="162" fill="#E8ECF0" font-size="14" font-weight="600" text-anchor="middle">📋 提交企业 KYB 认证</text>
    <text x="380" y="180" fill="#7B8CA8" font-size="11" text-anchor="middle">填写企业资料、法人信息、地址证明等</text>

    <!-- 箭头 → 判断 -->
    <path d="M 380,196 L 380,230" stroke="rgba(255,255,255,.18)" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>

    <!-- 判断：平台KYB审核通过？ -->
    <g transform="translate(380, 280)" filter="url(#shadow-diamond)">
      <rect x="-80" y="-50" width="160" height="100" rx="8" fill="#131820" stroke="rgba(255,255,255,.2)" stroke-width="1.5" transform="rotate(45)"/>
      <text x="0" y="-6" fill="#E8ECF0" font-size="13" font-weight="500" text-anchor="middle">平台 KYB</text>
      <text x="0" y="8" fill="#E8ECF0" font-size="13" font-weight="500" text-anchor="middle">审核通过？</text>
    </g>

    <!-- N 路径：驳回重提（左） -->
    <path d="M 308,280 L 130,280 L 130,370 L 175,370" stroke="#EF4444" stroke-width="1.5" fill="none" marker-end="url(#arrow-red)"/>
    <rect x="90" y="340" width="60" height="20" rx="10" fill="rgba(239,68,68,.15)"/>
    <text x="120" y="354" fill="#EF4444" font-size="10" font-weight="600" text-anchor="middle">未通过</text>

    <!-- 驳回节点 -->
    <rect x="175" y="355" width="190" height="46" rx="23" fill="rgba(239,68,68,.08)" stroke="rgba(239,68,68,.25)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="270" y="374" fill="#EF4444" font-size="13" font-weight="600" text-anchor="middle">🔄 修改资料重新提交 KYB</text>
    <text x="270" y="390" fill="#EF4444" font-size="10" text-anchor="middle" opacity=".7">根据驳回原因优化资料</text>

    <!-- 循环回去 -->
    <path d="M 175,401 L 120,401 L 120,168 L 175,168" stroke="rgba(239,68,68,.2)" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>

    <!-- Y 路径：通过（右） -->
    <path d="M 452,280 L 630,280 L 630,450 L 380,450" stroke="#22C55E" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
    <rect x="530" y="265" width="80" height="20" rx="10" fill="rgba(34,197,94,.15)"/>
    <text x="570" y="279" fill="#22C55E" font-size="10" font-weight="600" text-anchor="middle">✅ 通过 → 模块解锁</text>

    <!-- ============================================ -->
    <!-- 3. 上游KYB -->
    <!-- ============================================ -->

    <!-- 步骤节点：提交上游KYB -->
    <rect x="175" y="450" width="410" height="66" rx="8" fill="#131820" stroke="rgba(255,255,255,.15)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="380" y="472" fill="#E8ECF0" font-size="14" font-weight="600" text-anchor="middle">📤 提交上游发卡方 KYB</text>
    <text x="380" y="490" fill="#7B8CA8" font-size="11" text-anchor="middle">平台 KYB 资料自动带入，补充发卡方特有字段</text>
    <text x="380" y="504" fill="#4B5563" font-size="10" text-anchor="middle">二次补充确认后提交</text>

    <!-- 箭头 → 判断 -->
    <path d="M 380,516 L 380,550" stroke="rgba(255,255,255,.18)" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>

    <!-- 判断：上游KYB审核通过？ -->
    <g transform="translate(380, 600)" filter="url(#shadow-diamond)">
      <rect x="-80" y="-50" width="160" height="100" rx="8" fill="#131820" stroke="rgba(255,255,255,.2)" stroke-width="1.5" transform="rotate(45)"/>
      <text x="0" y="-6" fill="#E8ECF0" font-size="13" font-weight="500" text-anchor="middle">上游 KYB</text>
      <text x="0" y="8" fill="#E8ECF0" font-size="13" font-weight="500" text-anchor="middle">审核通过？</text>
    </g>

    <!-- N 路径：驳回重提上游（左） -->
    <path d="M 308,600 L 130,600 L 130,670 L 175,670" stroke="#EF4444" stroke-width="1.5" fill="none" marker-end="url(#arrow-red)"/>
    <rect x="90" y="585" width="60" height="20" rx="10" fill="rgba(239,68,68,.15)"/>
    <text x="120" y="599" fill="#EF4444" font-size="10" font-weight="600" text-anchor="middle">未通过</text>

    <!-- 驳回节点 -->
    <rect x="175" y="655" width="230" height="46" rx="23" fill="rgba(239,68,68,.08)" stroke="rgba(239,68,68,.25)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="290" y="674" fill="#EF4444" font-size="13" font-weight="600" text-anchor="middle">🔄 优化资料重新提交上游 KYB</text>
    <text x="290" y="690" fill="#EF4444" font-size="10" text-anchor="middle" opacity=".7">根据发卡方反馈调整资料</text>

    <!-- 循环回去 -->
    <path d="M 175,701 L 100,701 L 100,483 L 175,483" stroke="rgba(239,68,68,.2)" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>

    <!-- Y 路径：通过（右→下） -->
    <path d="M 452,600 L 630,600 L 630,760 L 380,760" stroke="#22C55E" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
    <rect x="545" y="585" width="70" height="20" rx="10" fill="rgba(34,197,94,.15)"/>
    <text x="580" y="599" fill="#22C55E" font-size="10" font-weight="600" text-anchor="middle">✅ 通过</text>

    <!-- ============================================ -->
    <!-- 4. 开卡 -->
    <!-- ============================================ -->

    <!-- 步骤节点：输入开卡数量 -->
    <rect x="175" y="760" width="410" height="56" rx="8" fill="#131820" stroke="rgba(255,255,255,.15)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="380" y="782" fill="#E8ECF0" font-size="14" font-weight="600" text-anchor="middle">🔢 输入开卡总数量</text>
    <text x="380" y="800" fill="#7B8CA8" font-size="11" text-anchor="middle">单次最多 100 张，同时补充持卡人信息（平台 KYB 数据预填）</text>

    <path d="M 380,816 L 380,850" stroke="rgba(255,255,255,.18)" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>

    <!-- 步骤节点：系统自动创建 -->
    <rect x="175" y="855" width="410" height="56" rx="8" fill="#131820" stroke="rgba(229,147,3,.25)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="380" y="877" fill="#E59303" font-size="14" font-weight="600" text-anchor="middle">⚙️ 系统自动创建持卡人 + 生成卡片</text>
    <text x="380" y="895" fill="#7B8CA8" font-size="11" text-anchor="middle">按 ≤20 张/持卡人规则自动拆分，同步生成全部卡片</text>

    <path d="M 380,911 L 380,950" stroke="rgba(255,255,255,.18)" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>

    <!-- 提示说明 -->
    <rect x="160" y="940" width="440" height="32" rx="6" fill="rgba(229,147,3,.06)" stroke="rgba(229,147,3,.12)" stroke-width="1"/>
    <text x="380" y="960" fill="#E59303" font-size="11" text-anchor="middle">💡 同一 KYB 信息可创建 N 个持卡人，每持卡人 ≤20 张卡</text>

    <!-- ============================================ -->
    <!-- 5. 激活 -->
    <!-- ============================================ -->

    <path d="M 380,972 L 380,1010" stroke="rgba(255,255,255,.18)" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>

    <!-- 步骤节点：卡片列表（待激活） -->
    <rect x="175" y="1015" width="410" height="56" rx="8" fill="#131820" stroke="rgba(255,255,255,.15)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="380" y="1037" fill="#E8ECF0" font-size="14" font-weight="600" text-anchor="middle">📋 卡片列表展示（状态：待激活）</text>
    <text x="380" y="1055" fill="#7B8CA8" font-size="11" text-anchor="middle">查看生成的卡片，点击「激活」开始激活流程</text>

    <path d="M 380,1071 L 380,1105" stroke="rgba(255,255,255,.18)" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>

    <!-- 步骤节点：激活卡片 -->
    <rect x="175" y="1110" width="410" height="56" rx="8" fill="#131820" stroke="rgba(139,92,246,.25)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="380" y="1132" fill="#8B5CF6" font-size="14" font-weight="600" text-anchor="middle">✅ 激活卡片 · 填写员工信息</text>
    <text x="380" y="1150" fill="#7B8CA8" font-size="11" text-anchor="middle">持卡人姓名 ｜ 邮箱 ｜ 首次充值金额</text>

    <!-- ============================================ -->
    <!-- 6. 使用 -->
    <!-- ============================================ -->

    <path d="M 380,1166 L 380,1200" stroke="rgba(255,255,255,.18)" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>

    <!-- 终点节点：卡片可用 -->
    <rect x="175" y="1205" width="410" height="56" rx="28" fill="url(#grad-end)" stroke="rgba(16,185,129,.3)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="380" y="1227" fill="#10B981" font-size="15" font-weight="700" text-anchor="middle">🎉 卡片激活成功 · 可充值使用</text>
    <text x="380" y="1245" fill="#7B8CA8" font-size="11" text-anchor="middle">卡片状态变为「使用中」，可充值、消费、管理</text>

    <!-- 后续操作分支 -->
    <path d="M 380,1261 L 380,1290" stroke="rgba(255,255,255,.12)" stroke-width="1" fill="none"/>
    <line x1="200" y1="1290" x2="560" y2="1290" stroke="rgba(255,255,255,.08)" stroke-width="1"/>

    <!-- 后续操作三个节点 -->
    <!-- 新增持卡人 -->
    <rect x="195" y="1300" width="150" height="40" rx="20" fill="rgba(59,130,246,.1)" stroke="rgba(59,130,246,.2)" stroke-width="1"/>
    <text x="270" y="1325" fill="#3B82F6" font-size="12" font-weight="500" text-anchor="middle">➕ 新增持卡人 + 开卡</text>

    <!-- 卡片管理 -->
    <rect x="365" y="1300" width="150" height="40" rx="20" fill="rgba(59,130,246,.1)" stroke="rgba(59,130,246,.2)" stroke-width="1"/>
    <text x="440" y="1325" fill="#3B82F6" font-size="12" font-weight="500" text-anchor="middle">🔧 管理现有卡片</text>

    <!-- 账单报表 -->
    <rect x="535" y="1300" width="150" height="40" rx="20" fill="rgba(59,130,246,.1)" stroke="rgba(59,130,246,.2)" stroke-width="1"/>
    <text x="610" y="1325" fill="#3B82F6" font-size="12" font-weight="500" text-anchor="middle">📊 查看账单报表</text>

    <!-- 三条小箭头 -->
    <path d="M 200,1290 L 200,1300" stroke="rgba(59,130,246,.15)" stroke-width="1" fill="none" marker-end="url(#arrow-blue)"/>
    <path d="M 380,1290 L 380,1300" stroke="rgba(59,130,246,.15)" stroke-width="1" fill="none" marker-end="url(#arrow-blue)"/>
    <path d="M 560,1290 L 560,1300" stroke="rgba(59,130,246,.15)" stroke-width="1" fill="none" marker-end="url(#arrow-blue)"/>

    <!-- ===== 图例 ===== -->
    <g transform="translate(555, 1360)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
      <text x="12" y="18" fill="#7B8CA8" font-size="10" font-weight="600">📋 图例</text>
      <rect x="12" y="28" width="16" height="16" rx="4" fill="#131820" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
      <text x="34" y="40" fill="#7B8CA8" font-size="10">操作步骤</text>
      <rect x="12" y="50" width="16" height="16" rx="4" fill="#131820" stroke="rgba(255,255,255,.2)" stroke-width="1" transform="rotate(45, 20, 58)"/>
      <text x="34" y="62" fill="#7B8CA8" font-size="10">审核判断</text>
      <rect x="12" y="72" width="16" height="16" rx="8" fill="rgba(239,68,68,.08)" stroke="rgba(239,68,68,.25)" stroke-width="1"/>
      <text x="34" y="84" fill="#7B8CA8" font-size="10">驳回 / 重提</text>
    </g>

  </svg>
</div>
</body>
</html>
