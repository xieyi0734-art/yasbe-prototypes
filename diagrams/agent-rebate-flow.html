<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>代理返佣业务流程图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0B0E14; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
  
  .header { 
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 10px 14px 8px;
    background: linear-gradient(180deg, rgba(11,14,20,.95) 60%, transparent);
  }
  .header h1 { color: #E8ECF0; font-size: 15px; font-weight: 700; }
  .header p { color: #7B8CA8; font-size: 11px; margin-top: 1px; }
  
  .canvas-wrap {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    touch-action: none;
  }
  
  svg {
    position: absolute;
    transform-origin: 0 0;
    /* transform set by JS */
  }
  
  .controls {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 100;
    display: flex; gap: 8px;
    background: rgba(19,24,32,.85);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 6px 8px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .controls button {
    background: transparent; border: none;
    color: #B0C0D8; font-size: 16px;
    width: 36px; height: 36px;
    border-radius: 6px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .controls button:active { background: rgba(255,255,255,.1); }
  .controls .zoom-label {
    color: #7B8CA8; font-size: 11px;
    display: flex; align-items: center; padding: 0 4px;
    min-width: 40px; justify-content: center;
  }
  
  /* Hint overlay */
  .hint {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    z-index: 99;
    color: rgba(255,255,255,.3);
    font-size: 11px;
    background: rgba(0,0,0,.5);
    padding: 6px 12px;
    border-radius: 8px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .6s;
    white-space: nowrap;
  }
  .hint.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>📊 代理返佣业务流程图</h1>
  <p>平台 → 代理 → C端用户 · 开户费返佣 &amp; 充值返点</p>
</div>

<div class="canvas-wrap" id="canvas">
  <svg id="flowchart" viewBox="0 0 1150 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,.2)"/>
      </marker>
      <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#E59303"/>
      </marker>
      <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#22C55E"/>
      </marker>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6"/>
      </marker>
      <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
      </marker>
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- ========== 泳道背景 ========== -->
    <!-- 平台管理端 -->
    <rect x="30" y="50" width="1090" height="240" rx="12" fill="rgba(229,147,3,.04)" stroke="rgba(229,147,3,.12)" stroke-width="1"/>
    <text x="50" y="78" fill="#E59303" font-size="11" font-weight="600" letter-spacing=".5">🏢 平台管理端</text>

    <!-- 代理端 -->
    <rect x="30" y="300" width="1090" height="240" rx="12" fill="rgba(59,130,246,.04)" stroke="rgba(59,130,246,.12)" stroke-width="1"/>
    <text x="50" y="328" fill="#3B82F6" font-size="11" font-weight="600" letter-spacing=".5">👤 代理端</text>

    <!-- C端用户 -->

    <text x="50" y="578" fill="#22C55E" font-size="11" font-weight="600" letter-spacing=".5">👥 C端用户</text>

    <!-- 系统结算层 -->

    <text x="50" y="768" fill="#7B8CA8" font-size="11" font-weight="600" letter-spacing=".5">⚙️ 系统结算层</text>

    <!-- 数据查看层 -->
    <rect x="30" y="910" width="1090" height="150" rx="12" fill="rgba(147,51,234,.04)" stroke="rgba(147,51,234,.12)" stroke-width="1"/>
    <text x="50" y="938" fill="#9333EA" font-size="11" font-weight="600" letter-spacing=".5">📊 数据查看</text>

    <!-- ========== 阶段标签（顶部时间轴） ========== -->

    <text x="1050" y="782" fill="#E8ECF0" font-size="13" font-weight="500" text-anchor="middle">计算充值返点</text>
    <text x="1050" y="800" fill="#7B8CA8" font-size="10" text-anchor="middle">充值金额 × 返点比例</text>

    <path d="M 790,814 L 790,840 L 1050,840 L 1050,860" stroke="#E59303" stroke-width="2" fill="none"/>

    <!-- 系统：结算到代理平台钱包 -->

    <path d="M 260,967 L 300,967" stroke="rgba(255,255,255,.2)" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>

    <text x="660" y="962" fill="#4B5563" font-size="12" font-weight="400" text-anchor="middle">C端用户</text>

    <!-- ========== 图例 ========== -->
    <g transform="translate(900, 28)">
      <rect x="0" y="0" width="220" height="90" rx="8" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>

</div>

<div class="hint" id="hint">👆 双指缩放 · 拖拽平移</div>

<div class="controls">
  <button id="zoomOut">−</button>
  <span class="zoom-label" id="zoomLabel">100%</span>
  <button id="zoomIn">+</button>
  <button id="resetBtn">⟲</button>
</div>

<script>
(function(){
  var svg = document.getElementById('flowchart');
  var wrap = document.getElementById('canvas');
  var hint = document.getElementById('hint');
  var zoomLabel = document.getElementById('zoomLabel');

  // State
  var scale = 1;
  var tx = 0, ty = 0;
  var minScale = 0.2, maxScale = 3;
  
  // Touch state
  var touches = [];
  var lastDist = 0;
  var lastCX = 0, lastCY = 0;
  var isPan = false;
  var isPinch = false;

  function updateTransform() {
    svg.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
    zoomLabel.textContent = Math.round(scale * 100) + '%';
  }

  function fitToScreen() {
    var w = wrap.clientWidth;
    var h = wrap.clientHeight;
    var svgW = 1150, svgH = 1080;
    // Leave room for header (56px) and controls (56px)
    var availH = h - 64 - 64;
    var availW = w - 16;
    scale = Math.min(availW / svgW, availH / svgH, 0.85);
    if (scale < minScale) scale = minScale;
    if (scale > 1.2) scale = 1.2;
    tx = (w - svgW * scale) / 2;
    ty = (h - svgH * scale) / 2;
    updateTransform();
  }

  function handleTouchStart(e) {
    e.preventDefault();
    touches = Array.from(e.touches);
    if (touches.length === 1) {
      isPan = true;
      isPinch = false;
    } else if (touches.length === 2) {
      isPinch = true;
      isPan = false;
      var dx = touches[0].clientX - touches[1].clientX;
      var dy = touches[0].clientY - touches[1].clientY;
      lastDist = Math.sqrt(dx * dx + dy * dy);
      lastCX = (touches[0].clientX + touches[1].clientX) / 2;
      lastCY = (touches[0].clientY + touches[1].clientY) / 2;
    }
    // Hide hint on first touch
    hint.classList.remove('show');
  }

  function handleTouchMove(e) {
    e.preventDefault();
    var newTouches = Array.from(e.touches);
    
    if (isPan && newTouches.length === 1) {
      var dx = newTouches[0].clientX - touches[0].clientX;
      var dy = newTouches[0].clientY - touches[0].clientY;
      tx += dx;
      ty += dy;
      touches = newTouches;
      updateTransform();
    } else if (isPinch && newTouches.length === 2) {
      var dx = newTouches[0].clientX - newTouches[1].clientX;
      var dy = newTouches[0].clientY - newTouches[1].clientY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      
      var newCX = (newTouches[0].clientX + newTouches[1].clientX) / 2;
      var newCY = (newTouches[0].clientY + newTouches[1].clientY) / 2;
      
      var scaleFactor = dist / lastDist;
      var newScale = scale * scaleFactor;
      newScale = Math.max(minScale, Math.min(maxScale, newScale));
      
      // Pinch zoom toward center point
      var actualScale = newScale / scale;
      tx = newCX - actualScale * (newCX - tx);
      ty = newCY - actualScale * (newCY - ty);
      scale = newScale;
      
      lastDist = dist;
      lastCX = newCX;
      lastCY = newCY;
      touches = newTouches;
      updateTransform();
    }
  }

  function handleTouchEnd(e) {
    if (e.touches.length === 0) {
      isPan = false;
      isPinch = false;
    } else if (e.touches.length === 1) {
      isPan = true;
      isPinch = false;
      touches = Array.from(e.touches);
    }
  }

  // Mouse wheel zoom
  function handleWheel(e) {
    e.preventDefault();
    var delta = e.deltaY > 0 ? 0.9 : 1.1;
    var newScale = scale * delta;
    newScale = Math.max(minScale, Math.min(maxScale, newScale));
    
    var rect = wrap.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;
    
    var actualScale = newScale / scale;
    tx = mx - actualScale * (mx - tx);
    ty = my - actualScale * (my - ty);
    scale = newScale;
    updateTransform();
  }

  // Mouse drag pan
  var mouseDown = false;
  var mouseStartX, mouseStartY;
  var panStartTX, panStartTY;

  function handleMouseDown(e) {
    mouseDown = true;
    mouseStartX = e.clientX;
    mouseStartY = e.clientY;
    panStartTX = tx;
    panStartTY = ty;
  }

  function handleMouseMove(e) {
    if (!mouseDown) return;
    tx = panStartTX + (e.clientX - mouseStartX);
    ty = panStartTY + (e.clientY - mouseStartY);
    updateTransform();
  }

  function handleMouseUp() {
    mouseDown = false;
  }

  // Button controls
  document.getElementById('zoomIn').addEventListener('click', function() {
    var newScale = Math.min(maxScale, scale * 1.3);
    var w = wrap.clientWidth, h = wrap.clientHeight;
    var cx = w/2, cy = h/2;
    var actualScale = newScale / scale;
    tx = cx - actualScale * (cx - tx);
    ty = cy - actualScale * (cy - ty);
    scale = newScale;
    updateTransform();
  });

  document.getElementById('zoomOut').addEventListener('click', function() {
    var newScale = Math.max(minScale, scale / 1.3);
    var w = wrap.clientWidth, h = wrap.clientHeight;
    var cx = w/2, cy = h/2;
    var actualScale = newScale / scale;
    tx = cx - actualScale * (cx - tx);
    ty = cy - actualScale * (cy - ty);
    scale = newScale;
    updateTransform();
  });

  document.getElementById('resetBtn').addEventListener('click', fitToScreen);

  // Events
  wrap.addEventListener('touchstart', handleTouchStart, {passive: false});
  wrap.addEventListener('touchmove', handleTouchMove, {passive: false});
  wrap.addEventListener('touchend', handleTouchEnd);
  wrap.addEventListener('wheel', handleWheel, {passive: false});
  wrap.addEventListener('mousedown', handleMouseDown);
  window.addEventListener('mousemove', handleMouseMove);
  window.addEventListener('mouseup', handleMouseUp);

  // Show hint briefly
  setTimeout(function() {
    hint.classList.add('show');
    setTimeout(function() { hint.classList.remove('show'); }, 3000);
  }, 500);

  // Init
  fitToScreen();
  window.addEventListener('resize', fitToScreen);
})();
</script>
</body>
</html>
