const $=s=>document.querySelector(s);const state={type:'personal',page:'login',email:'',first:'',middle:'',last:'',company:'',referral:'',flow:'login',verified:false};let timer=null,remaining=0;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const typeName=()=>state.type==='personal'?'个人':'企业';const icon=t=>`<svg viewBox="0 0 24 24" aria-hidden="true">${t==='personal'?'<circle cx="12" cy="8" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/>':'<path d="M4 22V3h12v19M16 10h4v12M8 7h4M8 11h4M8 15h4M2 22h20"/>'}</svg>`;
function field(id,label,placeholder='',type='text',value=''){return `<label class="field" for="${id}">${label}<div class="input-wrap"><input id="${id}" name="${id}" type="${type}" placeholder="${placeholder}" value="${esc(value)}" autocomplete="off">${type==='password'?`<button type="button" class="reveal" data-reveal="${id}" aria-label="显示${label}">显示</button>`:''}</div></label>`}

let steps=reg?['选择账户类型','填写账户资料','验证邮箱']:['选择账户类型','登录账户','安全验证'];let active=p==='choose'?0:p==='verify'||p==='success'?2:1;$('#rail').innerHTML=`<div class="rail-head">${reg?'CREATE ACCOUNT':'ACCOUNT ACCESS'}</div>${steps.map((s,i)=>`<div class="rail-item ${i===active?'active':''}"><span class="number">${i<active?'✓':i+1}</span><div><b>${s}</b><small>${(reg?['个人或企业，按需选择','填写基本信息即可开始','确认邮箱属于你']:['个人与企业，独立入口','使用你的邮箱和密码','保护每一次账户访问'])[i]}</small></div></div>`).join('')}<div class="rail-foot"><strong>${state.type==='personal'?'为个人日常而设':'为企业业务而设'}</strong>${state.type==='personal'?'从一个账户开始，连接你的收付款体验。':'以企业身份开始，让业务资金井然有序。'}</div>`;let html='';
if(p==='choose')html=`<div class="topline"><h2>你想创建哪种账户？</h2><span class="badge">01 / 03</span></div><div class="choices">${['personal','enterprise'].map(t=>`<button class="choice" data-type="${t}"><span class="choice-icon">${icon(t)}</span><span><b>${t==='personal'?'个人账户':'企业账户'}</b><small>${t==='personal'?'以个人身份使用，管理个人资金。':'以企业身份使用，管理企业业务资金。'}</small></span><span class="arrow">↗</span></button>`).join('')}</div><p class="minor">账户类型决定后续的认证流程。</p>`;
if(p==='login')html=`<div class="topline"><h2>登录账户</h2><span class="badge">${typeName()}账户</span></div><div class="segmented" aria-label="登录账户类型">${['personal','enterprise'].map(t=>`<button data-login-type="${t}" aria-pressed="${state.type===t}">${t==='personal'?'个人登录':'企业登录'}</button>`).join('')}</div><form id="form">${field('email',state.type==='personal'?'邮箱':'企业账户邮箱','name@example.com','email',state.email)}${field('password','密码','输入登录密码','password')}<div class="aux"><label class="check"><input type="checkbox" id="remember">记住邮箱</label><button type="button" class="link" data-go="reset">忘记密码？</button></div><div class="error" role="alert" id="error"></div><button class="primary">登录${typeName()}账户 <span aria-hidden="true">→</span></button></form><p class="minor">还没有账户？ <button class="link" data-go="choose">立即注册</button></p>`;
if(p==='register')html=`<div class="topline"><h2>${typeName()}账户资料</h2><button class="link" data-go="choose">更换类型</button></div><form id="form">${state.type==='personal'?`<div class="row">${field('last','姓','如：陈','text',state.last)}${field('first','名','如：悦','text',state.first)}</div>${field('middle','中间名 <span class="optional">（选填）</span>','如有，请填写','text',state.middle)}`:field('company','企业名称','填写企业法定名称','text',state.company)}${field('email',state.type==='personal'?'邮箱':'企业账户邮箱','name@example.com','email',state.email)}<div class="row">${field('password','设置密码','设置登录密码','password')}${field('confirm','确认密码','再次输入密码','password')}</div>${field('referral','邀请码 <span class="optional">（选填）</span>','如有，请填写','text',state.referral)}<div class="aux"><label class="check"><input id="agree" type="checkbox"><span>我已阅读并同意 <button type="button" class="link" data-policy="服务条款">服务条款</button> 与 <button type="button" class="link" data-policy="隐私政策">隐私政策</button></span></label></div><div class="error" role="alert" id="error"></div><button class="primary">创建账户并验证邮箱 →</button></form>`;
if(p==='reset')html=`<div class="topline"><h2>找回密码</h2><span class="badge">${typeName()}账户</span></div><p class="verify-copy">输入你的账户邮箱，完成验证后即可设置新密码。</p><form id="form">${field('email','账户邮箱','name@example.com','email',state.email)}<div class="error" id="error" role="alert"></div><button class="primary">继续</button></form><p class="minor"><button class="link" data-go="login">← 返回登录</button></p>`;
if(p==='verify')html=`<div class="mail-icon" aria-hidden="true">✉</div><div class="topline"><h2>验证你的邮箱</h2><span class="badge">${typeName()}账户</span></div><p class="verify-copy">请输入发送至<br><strong>${esc(state.email)}</strong> 的验证码。</p><form id="form"><label class="field" for="code">邮箱验证码<input class="code" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></label><div class="error" id="error" role="alert"></div><button class="primary">验证并继续 →</button></form><div class="aux" style="margin-top:20px"><button class="link" id="back-email">修改邮箱</button><button class="link" id="resend">重新发送</button></div><p class="pmnote">[原型演示] 使用验证码 246810，或点击下方填入。</p>`;
if(p==='new-password')html=`<div class="topline"><h2>设置新密码</h2><span class="badge">邮箱已验证</span></div><form id="form">${field('password','新密码','输入新密码','password')}${field('confirm','确认新密码','再次输入新密码','password')}<div class="error" id="error" role="alert"></div><button class="primary">保存新密码</button></form>`;
if(p==='success'){const reset=state.flow==='reset',registered=state.flow==='register';html=`<div class="success"><div class="success-mark">✓</div><h2>${reset?'密码已重置':registered?`${typeName()}账户创建成功`:`已登录${typeName()}账户`}</h2><p class="subtitle">${reset?'现在可以使用新密码重新登录。':registered?'邮箱验证已完成，欢迎加入。':'欢迎回来，邮箱验证已完成。'}</p><div class="summary"><p><span>账户类型</span><b>${typeName()}账户</b></p>${registered?`<p><span>${state.type==='personal'?'姓名':'企业名称'}</span><b>${esc(state.type==='personal'?state.last+' '+state.first:state.company)}</b></p>`:''}<p><span>账户邮箱</span><b>${esc(state.email)}</b></p></div>${reset?'<button class="primary" data-go="login">返回登录</button>':'<button class="primary" id="enter-app">进入资金工作台 →</button>'}<p class="pmnote" style="margin-top:16px">[原型演示] 登录与注册均为模拟，不保存密码，不发送邮件。</p></div>`}$('#content').innerHTML=html;$('#sample').hidden=['choose','success'].includes(p);$('#sample').textContent=p==='verify'?'填入演示验证码':'填入演示资料';bind();if(p==='verify')countdown();}
function error(text){$('#error').textContent=text}function bind(){if($('#enter-app'))$('#enter-app').onclick=()=>{const identity={type:state.type,email:state.email.trim(),name:state.flow==='register'?(state.type==='personal'?[state.last,state.middle,state.first].filter(Boolean).join(' '):state.company):(state.type==='personal'?'陈悦':'远川科技有限公司'),fresh:state.flow==='register'};try{localStorage.setItem('client-demo-session',JSON.stringify(identity))}catch{}location.href='2026-11-17_资金工作台_客户端.html?identity='+encodeURIComponent(JSON.stringify(identity))};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{capture();go(b.dataset.go)});document.querySelectorAll('[data-policy]').forEach(b=>b.onclick=()=>{$('#policy-title').textContent=b.dataset.policy;$('#policy').showModal()});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;state.email='';go('register')});document.querySelectorAll('[data-login-type]').forEach(b=>b.onclick=()=>{capture();state.type=b.dataset.loginType;state.email='';render()});document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.reveal);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'显示':'隐藏';b.setAttribute('aria-label',b.textContent+'密码')});if($('#form'))$('#form').onsubmit=e=>{e.preventDefault();submit()};if($('#back-email'))$('#back-email').onclick=()=>go(state.flow==='register'?'register':state.flow==='reset'?'reset':'login');if($('#resend'))$('#resend').onclick=()=>{remaining=30;countdown();$('#code').value='';$('#code').focus()}}
function countdown(){clearInterval(timer);if(remaining<=0)remaining=30;const update=()=>{const b=$('#resend');if(!b)return;b.disabled=remaining>0;b.textContent=remaining>0?`${remaining} 秒后重新发送`:'重新发送'};update();timer=setInterval(()=>{remaining--;update();if(remaining<=0)clearInterval(timer)},1000)}
function submit(){capture();const p=state.page;if(['login','register','reset'].includes(p)&&!state.email.trim())return error('请填写账户邮箱。');if(p==='register'){if(state.type==='personal'&&(!state.first.trim()||!state.last.trim()))return error('请填写姓名。');if(state.type==='enterprise'&&!state.company.trim())return error('请填写企业名称。');if(!$('#agree').checked)return error('请先阅读并同意服务条款与隐私政策。')}if(['login','register','new-password'].includes(p)&&!$('#password').value)return error('请填写密码。');if(['register','new-password'].includes(p)&&$('#password').value!==$('#confirm').value)return error('两次输入的密码不一致。');if(p==='verify'){if($('#code').value!=='246810')return error('验证码不正确，请重新输入。');state.verified=true;go(state.flow==='reset'?'new-password':'success');return}if(p==='new-password'){go('success');return}state.flow=p==='register'?'register':p==='reset'?'reset':'login';state.verified=false;if(p==='login'){try{if($('#remember').checked)localStorage.setItem('demo-remember-email',state.email);else localStorage.removeItem('demo-remember-email')}catch{}}const b=$('#form .primary');b.disabled=true;b.textContent='正在继续…';setTimeout(()=>{remaining=30;go('verify')},350)}
$('#sample').onclick=()=>{if(state.page==='verify'){$('#code').value='246810';$('#code').focus();return}const sample={email:state.type==='personal'?'yue.chen@example.com':'finance@example.com',last:'陈',first:'悦',middle:'',company:'远川科技有限公司',referral:'',password:'DemoOnly!2026',confirm:'DemoOnly!2026'};Object.entries(sample).forEach(([k,v])=>{if($('#'+k))$('#'+k).value=v});if($('#agree'))$('#agree').checked=true};$('#restart').onclick=()=>{Object.assign(state,{type:'personal',email:'',first:'',middle:'',last:'',company:'',referral:'',verified:false});go('login')};try{state.email=localStorage.getItem('demo-remember-email')||''}catch{}if(new URLSearchParams(location.search).has('ref'))state.referral=new URLSearchParams(location.search).get('ref');window.addEventListener('hashchange',render);render();
</script></body></html>
